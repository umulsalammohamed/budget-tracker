 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Part 4 - linking CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1 - Page structure -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p class="subtitle">Track your income and expenses in one place.</p>
    </header>

    <main>
        <!-- Part 2 - Add Expense section -->
        <section class="card" id="add-expense-section">
            <h2>Add Expense</h2>
            <div class="input-group">
                <label>Expense Name:</label>
                <input type="text" placeholder="e.g. Lunch">
            </div>
            <div class="input-group">
                <label>Amount:</label>
                <input type="number" placeholder="e.g. 500">
            </div>
            <div class="input-group">
                <label>Category:</label>
                <select>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                </select>
            </div>
            <button class="add-btn">Add Expense</button>
        </section>

        <!-- Part 3 - Your Expenses placeholder -->
        <section class="card" id="expenses-section">
            <h2>Your Expenses</h2>
            <p class="placeholder">No expenses yet</p>
        </section>
    </main>

</body>
</html>
