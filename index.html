<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Budget Tracker Week 2</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
<img src="https://cdn-icons-png.flaticon.com/512/2331/2331947.png" alt="Budget Logo" width="60">
<h1>My Budget Tracker</h1>
</header>
<main>
<section>
<h2>Expenses</h2>
<table>
<thead><tr><th>Name</th><th>Amount</th><th>Category</th><th>Date</th></tr></thead>
<tbody>
<tr><td>Lunch</td><td>450</td><td>Food</td><td>2026-09-08</td></tr>
<tr><td>Matatu</td><td>100</td><td>Transport</td><td>2026-09-09</td></tr>
<tr><td>Rent</td><td>8000</td><td>Rent</td><td>2026-09-01</td></tr>
<tr><td>Netflix</td><td>1200</td><td>Entertainment</td><td>2026-09-05</td></tr>
<tr><td>Books</td><td>2500</td><td>Other</td><td>2026-09-07</td></tr>
</tbody>
</table>
</section>
<section>
<h2>Add Expense</h2>
<form>
<label for="expense-name">Name:</label>
<input type="text" id="expense-name">
<label for="expense-amount">Amount:</label>
<input type="number" id="expense-amount">
<label for="expense-category">Category:</label>
<select id="expense-category">
<option value="">Choose</option>
<option>Food</option><option>Transport</option><option>Rent</option><option>Entertainment</option><option>Other</option>
</select>
<label for="expense-date">Date:</label>
<input type="date" id="expense-date">
<button type="button">Add Expense</button>
</form>
</section>
<section>
<iframe width="560" height="315" src="https://www.youtube.com/embed/4j2emMn_9h4" title="Budget Tips" frameborder="0"></iframe>
</section>
<details><summary>How to use this tracker</summary><p>Add expenses via form, view in table.</p></details>
</main>
</body></html>
