<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker - Visual Identity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Card 1: Page Heading -->
        <header class="card header-card">
            <h1>My Budget Tracker</h1>
            <p class="subtitle">Track your expenses with style and clarity</p>
        </header>

        <!-- Card 2: Add Expense Form -->
        <section class="card form-card">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount (KES)</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 1500" required>
                </div>
                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Housing">Housing</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" required>
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </section>

        <!-- Card 3: Expense Table -->
        <section class="card table-card">
            <h2>Expense History</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Groceries</td><td>KES 2,500</td><td>Food</td><td>2026-09-10</td></tr>
                        <tr><td>Matatu Fare</td><td>KES 300</td><td>Transport</td><td>2026-09-11</td></tr>
                        <tr><td>Internet Bill</td><td>KES 3,000</td><td>Housing</td><td>2026-09-12</td></tr>
                        <tr><td>Movie Night</td><td>KES 800</td><td>Entertainment</td><td>2026-09-12</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
